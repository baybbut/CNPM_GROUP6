# Existing SQL on host or shared SQL. No DB initialization/reset.
# docker compose --env-file muses-backend/.env up -d --build
services:
  backend:
    build:
      context: .
      target: backend
    env_file:
      - muses-backend/.env
    environment:
      DB_SERVER: ${DB_SERVER:-host.docker.internal}
      PORT: "3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health', {signal: AbortSignal.timeout(5000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 7s
      start_period: 30s
      retries: 5
    restart: unless-stopped

  website:
    build:
      context: .
      target: website
    environment:
      API_PROXY_TARGET: http://backend:3001
      VITE_API_BASE_URL: ""
      VITE_VISITOR_BASE_URL: ""
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  admin:
    build:
      context: .
      target: admin
    environment:
      API_PROXY_TARGET: http://backend:3001
    ports:
      - "127.0.0.1:5174:5174"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
